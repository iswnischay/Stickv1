# Stick V1 relay: a tiny Cloudflare Worker that passes game messages between the two players of a room.
# Deployed automatically by .github/workflows/deploy.yml when the CLOUDFLARE_* secrets are set.
name = "stickv1-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "WALLET"
class_name = "Wallet"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Quota"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Wallet", "Match"]

[vars]
FIREBASE_PROJECT_ID = "stickv1-36a11"
# GEMINI_API_KEY is a secret, set by the GitHub workflow from the GEMINI_API_KEY repository secret.
