name: Build and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Repository secret named API_KEY (Settings > Secrets and variables > Actions).
          # Pull requests never receive it, so their test builds simply have no shared key.
          VITE_GEMINI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.API_KEY || '' }}
          # Optional TURN relay so players on different networks can always connect (see README).
          TURN_URL: ${{ github.event_name != 'pull_request' && secrets.TURN_URL || '' }}
          TURN_USERNAME: ${{ github.event_name != 'pull_request' && secrets.TURN_USERNAME || '' }}
          TURN_CREDENTIAL: ${{ github.event_name != 'pull_request' && secrets.TURN_CREDENTIAL || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
